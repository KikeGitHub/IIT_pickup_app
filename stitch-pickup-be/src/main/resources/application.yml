spring:
  application:
    name: stitch-pickup-be

  # ─── DataSource ───────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stitch_pickup_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ─── JPA ─────────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway gestiona el schema; Hibernate solo valida
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  # ─── Flyway ──────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ─── WebSocket ───────────────────────────────────────────────────────────────
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

# ─── Server ───────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    com.stitchpickup: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

# ─── App custom properties ────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:stitch-pickup-super-secret-key-2026-change-in-production-min-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}    # 24 horas

# ─── Springdoc / Swagger UI ───────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  info:
    title: Stitch Pickup API
    description: Sistema de logística de recogida de alumnos — Instituto Inglés de Toluca
    version: 1.0.0

# ─── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
