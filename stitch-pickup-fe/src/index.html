<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>IIT Pickup — Instituto Inglés de Toluca</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IIT Pickup" id="apple-app-title">
  <meta name="description" content="Sistema de logística de recogida de alumnos del Instituto Inglés de Toluca. Padres notifican proximidad, maestros gestionan entregas en tiempo real.">
  <meta name="theme-color" content="#000e27" id="theme-color-meta">

  <!-- PWA & Favicons (Detección sincronizada para Safari iOS / Android) -->
  <link rel="manifest" href="manifest.webmanifest" id="app-manifest-link">
  <script>
    (function() {
      try {
        var path = window.location.pathname || '';
        var isTeacher = path.indexOf('maestro') !== -1 || path.indexOf('monitor') !== -1 || path.indexOf('teacher') !== -1;
        var cookieMatch = document.cookie.match(/(?:^|; )iit_preferred_portal=([^;]*)/);
        var preferred = cookieMatch ? cookieMatch[1] : (localStorage.getItem('iit_preferred_portal') || '');
        if (isTeacher || preferred === 'teacher') {
          var m = document.getElementById('app-manifest-link');
          if (m) m.href = '/manifest-maestros.webmanifest';
          var t = document.getElementById('apple-app-title');
          if (t) t.content = 'IIT Docentes';
          var c = document.getElementById('theme-color-meta');
          if (c) c.content = '#166534';
          document.title = 'IIT Docentes — Instituto Inglés de Toluca';
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">

  <!-- Google Fonts: Hanken Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- SockJS Browser Polyfill -->
  <script>
    var global = global || window;
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>IIT Pickup requiere JavaScript para funcionar. Por favor actívalo en tu navegador.</noscript>
</body>
</html>
