<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>IIT Pickup — Instituto Inglés de Toluca</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- PWA & Favicons (Detección sincrónica nativa para Safari iOS / Android) -->
  <script>
    (function() {
      try {
        var path = window.location.pathname || '';
        var isTeacher = path.indexOf('maestro') !== -1 || path.indexOf('monitor') !== -1 || path.indexOf('teacher') !== -1;
        var cookieMatch = document.cookie.match(/(?:^|; )iit_preferred_portal=([^;]*)/);
        var preferred = cookieMatch ? cookieMatch[1] : (localStorage.getItem('iit_preferred_portal') || '');
        if (isTeacher || preferred === 'teacher') {
          document.write('<link rel="manifest" href="/manifest-maestros.webmanifest" id="app-manifest-link">');
          document.write('<meta name="apple-mobile-web-app-title" content="IIT Docentes" id="apple-app-title">');
          document.write('<meta name="theme-color" content="#166534" id="theme-color-meta">');
          document.title = 'IIT Docentes — Instituto Inglés de Toluca';
        } else {
          document.write('<link rel="manifest" href="/manifest.webmanifest" id="app-manifest-link">');
          document.write('<meta name="apple-mobile-web-app-title" content="IIT Pickup" id="apple-app-title">');
          document.write('<meta name="theme-color" content="#000e27" id="theme-color-meta">');
        }
      } catch (e) {
        document.write('<link rel="manifest" href="/manifest.webmanifest" id="app-manifest-link">');
      }
    })();
  </script>
  <noscript>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="apple-mobile-web-app-title" content="IIT Pickup">
    <meta name="theme-color" content="#000e27">
  </noscript>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">

  <!-- Google Fonts: Hanken Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- SockJS Browser Polyfill -->
  <script>
    var global = global || window;
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>IIT Pickup requiere JavaScript para funcionar. Por favor actívalo en tu navegador.</noscript>
</body>
</html>
