<div class="mode-selector" role="group" aria-label="Modo de entrega">
  <button
    type="button"
    class="mode-btn"
    [class.mode-btn--active]="selectedMethod === 'CAR'"
    (click)="selectMode('CAR')"
  >
    <svg viewBox="0 0 24 24" fill="none" class="mode-icon" aria-hidden="true">
      <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9C2.1 11.1 2 11.5 2 12v4c0 .6.4 1 1 1h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="7" cy="17" r="2" stroke="currentColor" stroke-width="2"/>
      <circle cx="17" cy="17" r="2" stroke="currentColor" stroke-width="2"/>
    </svg>
    <div class="mode-text">
      <span class="mode-title">En Auto</span>
      <span class="mode-desc">Circuito escolar</span>
    </div>
  </button>

  <button
    type="button"
    class="mode-btn"
    [class.mode-btn--active]="selectedMethod === 'WALK'"
    (click)="selectMode('WALK')"
  >
    <svg viewBox="0 0 24 24" fill="none" class="mode-icon" aria-hidden="true">
      <circle cx="13" cy="4" r="2" stroke="currentColor" stroke-width="2"/>
      <path d="M11 20l-1-5 3-3 2 4M8 12l2-3 4 1 3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="mode-text">
      <span class="mode-title">A Pie</span>
      <span class="mode-desc">Puerta de acceso</span>
    </div>
  </button>
</div>
