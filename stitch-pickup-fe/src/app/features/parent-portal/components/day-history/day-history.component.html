<div class="history-card">
  <h3 class="history-title">
    <svg viewBox="0 0 24 24" fill="none" class="title-icon">
      <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
      <polyline points="12 6 12 12 16 14" stroke="currentColor" stroke-width="2"/>
    </svg>
    <span>Historial de Hoy</span>
  </h3>

  <div class="timeline">
    @for (ev of events; track ev.time) {
      <div class="timeline-item">
        <div class="timeline-time">{{ ev.time }}</div>
        <div class="timeline-dot" [class]="'timeline-dot--' + ev.type.toLowerCase()"></div>
        <div class="timeline-content">
          <p class="event-title">{{ ev.title }}</p>
          <p class="event-desc">{{ ev.description }}</p>
        </div>
      </div>
    } @empty {
      <p class="empty-text">Sin actividad registrada hoy.</p>
    }
  </div>
</div>
