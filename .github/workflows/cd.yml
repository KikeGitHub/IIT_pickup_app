name: CD - Deploy to Hetzner Cloud

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'MANUAL_*.html'
      - 'docs/**'
      - '*.png'
      - '*.jpg'
  workflow_dispatch:

concurrency:
  group: hetzner-production-deploy
  cancel-in-progress: false

jobs:
  # ─── 1. Validación de Frontend antes de deploy ────────────────────────────────
  frontend-check:
    name: Frontend Build Check (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stitch-pickup-fe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: stitch-pickup-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile Angular production bundle
        run: npm run build

  # ─── 2. Validación de Backend antes de deploy ─────────────────────────────────
  backend-check:
    name: Backend Build Check (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stitch-pickup-be

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile Java classes and test sources
        run: mvn clean test-compile -DskipTests

  # ─── 3. Deploy solo si ambos builds pasan ─────────────────────────────────────
  deploy:
    name: Deploy to Production (Hetzner VPS)
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check]

    steps:
      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Conectado al servidor Hetzner ($(hostname))..."
            cd /opt/iit_pickup

            echo "📦 [CI/CD] Descargando últimos cambios de main..."
            git fetch origin main
            git checkout main
            git pull origin main

            echo "🐳 [CI/CD] Reconstruyendo y actualizando contenedores de Docker..."
            if docker compose version &>/dev/null; then
              docker compose up -d --build
              docker image prune -f
            else
              sudo docker compose up -d --build
              sudo docker image prune -f
            fi

            echo "🩺 [CI/CD] Estado de los contenedores:"
            if docker compose version &>/dev/null; then
              docker compose ps
            else
              sudo docker compose ps
            fi

            echo "✅ [CI/CD] ¡Despliegue a producción completado exitosamente!"

