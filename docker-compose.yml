services:
  # ─── 1. Base de Datos PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: stitch-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stitch_pickup_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stitch_pickup_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stitch-network

  # ─── 2. Backend Spring Boot (Conectado a PostgreSQL en Hetzner) ────────────
  backend:
    build:
      context: ./stitch-pickup-be
      dockerfile: Dockerfile
    container_name: stitch-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Configuración de Base de Datos Interna en Docker
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/stitch_pickup_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASS: ${POSTGRES_PASSWORD:-admin}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/stitch_pickup_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-c3RpdGNoLXBpY2t1cC1qd3Qtc2VjcmV0LWtleS0yMDI2LXNlY3VyZS1oYXNoLWZvci1wcm9kdWN0aW9uLXN5c3RlbQ==}
      JWT_EXPIRATION_HOURS: 24
      SPRING_WEBSOCKET_ALLOWED_ORIGINS: "*"
      # Cloudinary & Upload Config
      CLOUDINARY_URL: ${CLOUDINARY_URL:-cloudinary://912463379929212:9CmlnIrFnEf4wbPISatNAAopJjU@lealtix-media}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-lealtix-media}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-912463379929212}
      CLOUDINARY_SECRET: ${CLOUDINARY_SECRET:-9CmlnIrFnEf4wbPISatNAAopJjU}
      UPLOAD_DIR: ${UPLOAD_DIR:-/tmp/uploads}
    ports:
      - "8080:8080"
    networks:
      - stitch-network

  # ─── 3. Frontend Angular + Nginx ─────────────────────────────────────────
  frontend:
    build:
      context: ./stitch-pickup-fe
      dockerfile: Dockerfile
    container_name: stitch-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3001:80"
    networks:
      - stitch-network

volumes:
  postgres_data:
    driver: local

networks:
  stitch-network:
    driver: bridge
