services:
  # ─── 1. Backend Spring Boot (Conectado a Neon PostgreSQL Serverless) ─────
  backend:
    build:
      context: ./stitch-pickup-be
      dockerfile: Dockerfile
    container_name: stitch-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://ep-holy-band-awa2j4it-pooler.c-12.us-east-1.aws.neon.tech/stitch_pickup_db?sslmode=require}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-neondb_owner}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-npg_OIhk9Zy2lczM}
      JWT_SECRET: ${JWT_SECRET:-c3RpdGNoLXBpY2t1cC1qd3Qtc2VjcmV0LWtleS0yMDI2LXNlY3VyZS1oYXNoLWZvci1wcm9kdWN0aW9uLXN5c3RlbQ==}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      SPRING_WEBSOCKET_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-https://pickup.institutoingles.edu.mx,http://localhost:4200}
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:--Xmx1024m -Xms256m -XX:+UseG1GC}
    networks:
      - stitch-network

  # ─── 2. Frontend Angular + Nginx (Único punto de entrada público) ─────────
  frontend:
    build:
      context: ./stitch-pickup-fe
      dockerfile: Dockerfile
    container_name: stitch-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - stitch-network

networks:
  stitch-network:
    driver: bridge
